<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120f0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<title>Melvor Idle 2</title>
<style>
:root{
  --bg:#120f0a;--bg2:#1a150f;--card:#221c14;--card2:#2a2219;--line:#3e3223;--line2:#5a4830;
  --gold:#f2c14e;--gold2:#c8962b;--goldglow:rgba(242,193,78,.35);--text:#efe5cc;--muted:#a3967b;--faint:#6f6450;
  --green:#7dd87a;--red:#ef6b5b;--blue:#79b8f0;--r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;
  min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 60% at 50% -10%,#2c2216 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit}
img{user-select:none;-webkit-user-drag:none}

/* app bar */
.appbar{position:sticky;top:0;z-index:10;padding:calc(8px + env(safe-area-inset-top)) 16px 0;background:rgba(18,15,10,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.appbar .top{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.appbar .ic{width:30px;height:30px}
.appbar .ttl{flex:1;min-width:0}
.appbar .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.chip.gold{color:var(--gold);border-color:#6a5222;background:#2c2312}
.chip svg{width:13px;height:13px}
.livebar{height:3px;margin:0 -16px;background:#2a2218;overflow:hidden}
.livebar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:0 0 8px var(--goldglow)}

main{padding:14px 16px 8px;max-width:760px;margin:0 auto}
h3{margin:22px 4px 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
h3:first-child{margin-top:4px}
h3 .more{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:600;color:var(--gold);font-size:13px;background:none;border:0;padding:0}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.25)}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}
.small{font-size:13px}.tiny{font-size:11.5px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic{width:36px;height:36px;object-fit:contain;flex:none;display:inline-block}
.ic.lg{width:56px;height:56px}.ic.sm{width:24px;height:24px}

/* hero */
.hero{position:relative;overflow:hidden;border-color:var(--line2)}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:220px;height:220px;background:radial-gradient(circle,var(--goldglow),transparent 65%);opacity:.5;pointer-events:none}
.ring{position:relative;width:84px;height:84px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .lv{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#1b150e;border:1px solid var(--gold2);color:var(--gold);font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px}
.hero .skill{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.hero .name{font-size:20px;font-weight:800;line-height:1.2;margin:2px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.bar{height:8px;background:#151109;border:1px solid #33291b;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.bar.xp i{background:linear-gradient(90deg,#3f8a4a,var(--green))}
i.fast{background:repeating-linear-gradient(110deg,var(--gold2) 0 14px,var(--gold) 14px 28px)!important;background-size:60px 100%!important;animation:flow .6s linear infinite}
@keyframes flow{to{background-position:60px 0}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:rgba(0,0,0,.22);border:1px solid #33291b;border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:16px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line2);
  background:var(--card2);font-weight:700;font-size:14px;cursor:pointer;transition:transform .08s ease,filter .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px}
.btn.gold{background:linear-gradient(180deg,#f5cf6a,#c8962b);border-color:#e0b04a;color:#2a1d05}
.btn.red{background:linear-gradient(180deg,#a8463b,#7d2f27);border-color:#b8584c;color:#fff}
.btn.green{background:linear-gradient(180deg,#4f9b4a,#2f6e2c);border-color:#62ad5c;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1}
.seg{display:flex;background:#151109;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0;border-radius:9px;font-weight:700;font-size:14px}
.seg button.on{background:linear-gradient(180deg,#3a2e1c,#2c2314);color:var(--gold);box-shadow:0 0 0 1px #6a5222 inset}
.iconbtn{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn.gold{color:#2a1d05;background:linear-gradient(180deg,#f5cf6a,#c8962b);border-color:#e0b04a}
svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* switch */
.switch{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #30271b}
.switch:first-child{border-top:0;padding-top:2px}
.switch input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:#3a3022;position:relative;flex:none;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#d8ccb0;transition:transform .2s}
.switch input:checked{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.switch input:checked::after{transform:translateX(20px);background:#fff}

/* lists */
.list>*+*{border-top:1px solid #30271b}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.li:first-child{border-top:0}

/* queue */
.qitem{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(0,0,0,.18);border:1px solid #33291b;transition:transform .15s,opacity .15s}
.qitem+.qitem{margin-top:8px}
.qitem.first{border-color:#6a5222;background:linear-gradient(90deg,rgba(242,193,78,.12),rgba(0,0,0,.18))}
.qitem.dragging{opacity:.45}
.qitem.over-up{box-shadow:0 -3px 0 var(--gold)}
.qitem.over-down{box-shadow:0 3px 0 var(--gold)}
.qnum{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:#2e2518;color:var(--muted);border:1px solid #4a3c27}
.qitem.first .qnum{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
.handle{width:28px;height:38px;flex:none;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:grab}
.handle svg{width:18px;height:18px}

/* grids */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.stile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 10px;border-radius:var(--r);
  background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);text-align:center}
.stile.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 18px var(--goldglow)}
.stile .mini{position:relative;width:54px;height:54px;display:grid;place-items:center}
.stile .mini svg{position:absolute;inset:0;transform:rotate(-90deg)}
.stile .nm{font-size:12.5px;font-weight:700;line-height:1.2}
.stile .lvl{font-size:11px;color:var(--muted)}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.tcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid #33291b;text-align:left;width:100%}
.tcard:active{border-color:var(--gold2)}
.tcard.locked{opacity:.5}
.tcard.running{border-color:#4f8a3e;background:linear-gradient(90deg,rgba(125,216,122,.1),rgba(0,0,0,.2))}
.tcard>.ic{width:44px;height:44px;align-self:flex-start}
.tcard .chev{color:var(--faint);flex:none}.tcard .chev svg{width:16px;height:16px}
.ic.xs{width:18px;height:18px}
.jump{position:sticky;top:57px;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;
  background:linear-gradient(var(--bg) 70%,transparent);scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump .chip{flex:none;color:var(--text)}
.badge.on{background:#21391f;color:var(--green);border-color:#4f8a3e}
.badge.q{background:#1f2c39;color:var(--blue);border-color:#3e5f8a}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:99px;background:#2e2518;color:var(--gold);border:1px solid #5a4523}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.btile{position:relative;aspect-ratio:1;border-radius:12px;background:radial-gradient(circle at 50% 35%,#2f261a,#1b160f);border:1px solid #3a2f20;display:grid;place-items:center;padding:0}
.btile .ic{width:44px;height:44px}
.btile .q{position:absolute;right:5px;bottom:3px;font-size:11.5px;font-weight:800;text-shadow:0 1px 2px #000,0 0 4px #000}
.btile.locked::after{content:"🔒";position:absolute;left:4px;top:2px;font-size:11px}
.btile.rule{border-color:#5a4523}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:760px;margin:0 auto;max-height:88vh;overflow:auto;
  background:linear-gradient(180deg,#2b231a,#1f1912);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;
  padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.sheet.on{transform:none;pointer-events:auto}
.grab{width:42px;height:5px;border-radius:9px;background:#4e4130;margin:0 auto 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid #3a2f20}
.opt b{color:var(--gold);white-space:nowrap;min-width:72px}
.opt:active{border-color:var(--gold2)}
input[type=number],input[type=text],input[type=search],select{background:#120e09;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:10px 12px;font:15px system-ui;min-height:44px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--gold2)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:rgba(20,16,11,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
nav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--faint);font-size:11px;font-weight:700;border-radius:12px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--gold)}
nav button.on svg{filter:drop-shadow(0 0 6px var(--goldglow))}

#toast{position:fixed;left:16px;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:50;max-width:520px;margin:0 auto;padding:12px 14px;border-radius:12px;
  background:#2d251a;border:1px solid #6a5222;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translateY(20px);opacity:0;transition:all .2s;pointer-events:none}
#toast.on{transform:none;opacity:1}
#toast.err{border-color:#9a4237}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.skel{height:80px;border-radius:var(--r);background:linear-gradient(90deg,#211b13,#2b2318,#211b13);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="appbar"><div class="top" id="appbar"></div><div class="livebar"><i id="livebar"></i></div></div>
<main id="view"><div class="skel"></div></main>
<nav id="nav"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n ?? 0).toLocaleString();
const short = n => { n = Number(n || 0); const a = Math.abs(n);
  return a >= 1e9 ? (n/1e9).toFixed(2).replace(/\.?0+$/,"")+"B" : a >= 1e6 ? (n/1e6).toFixed(2).replace(/\.?0+$/,"")+"M" : a >= 1e4 ? (n/1e3).toFixed(1).replace(/\.0$/,"")+"K" : fmt(Math.round(n)); };
const icon = (id, cls = "") => id ? `<img class="ic ${cls}" loading="lazy" src="/icon/${esc(id)}.png" alt="">` : `<span class="ic ${cls}"></span>`;
const I = {
  now: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  queue: '<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  skills: '<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/>',
  bank: '<path d="M3 9l9-5 9 5M5 10v8M19 10v8M9 10v8M15 10v8M3 20h18"/>',
  log: '<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/>',
  play: '<path d="M8 5l11 7-11 7z"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>', next: '<path d="M5 5l9 7-9 7zM18 5v14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>', grip: '<path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/>',
  hour: '<path d="M6 2h12M6 22h12M7 2c0 6 10 6 10 10S7 16 7 22M17 2c0 6-10 6-10 10s10 4 10 10"/>', back: '<path d="M15 18l-6-6 6-6"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
};
const svg = (name, extra = "") => `<svg viewBox="0 0 24 24" ${extra}>${I[name] || name}</svg>`;
const ring = (pct, size, stroke, color = "url(#g)") => { const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><defs><linearGradient id="g"><stop offset="0" stop-color="#c8962b"/><stop offset="1" stop-color="#f2c14e"/></linearGradient></defs>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#2e2518" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.max(0, Math.min(1, pct)))}"/></svg>`; };

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } }
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch {} };

let tab = store("tab") || "now";
let state = null, skill = null, bank = null, droplog = null, stateAt = 0;
let bankQuery = "", bankSort = store("bankSort") || "value";
let sheetOn = false, sheetMode = store("mode") || "queue", sheetTarget = null, askYes = null;

// ---- api -------------------------------------------------------------------------------------
async function api(path, body) {
  const res = await fetch("/api/" + path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let data = null;
  try { data = await res.json(); } catch {}
  if (res.status === 401) { showLogin(); throw new Error("not logged in"); }
  if (!res.ok) throw new Error(data?.error || ("Error " + res.status));
  return data;
}
async function act(path, body) {
  buzz();
  try { const r = await api(path, body); if (r?.message) toast(r.message); await load(); return r; }
  catch (e) { if (e.message !== "not logged in") toast(e.message, true); }
}
let toastTimer;
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "on" + (err ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "", 3200);
}
function showLogin() {
  $("#view").innerHTML = `<div class="card fade"><b class="gold">Not logged in</b><p class="muted">In the game, open Settings → Melvor2Tweaks → Phone access and scan the QR code (or open the copied link) on this phone.</p></div>`;
}

// ---- nav + app bar ---------------------------------------------------------------------------
const TABS = [["now", "Now"], ["queue", "Queue"], ["skills", "Skills"], ["bank", "Bank"], ["log", "Log"]];
function drawNav() { $("#nav").innerHTML = TABS.map(([id, label]) => `<button data-tab="${id}" class="${tab === id ? "on" : ""}">${svg(id)}${label}</button>`).join(""); }
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  if (tab === b.dataset.tab && tab === "skills") skill = null;
  tab = b.dataset.tab; store("tab", tab); drawNav(); render(); load(); window.scrollTo({ top: 0 });
});
function drawAppbar() {
  const r = state.running;
  $("#appbar").innerHTML = `${r ? icon(r.icon) : `<span class="ic"></span>`}
    <div class="ttl"><b>${r ? esc(r.label.split(": ").slice(1).join(": ") || r.label) : "Idle"}</b><span>${r ? esc(r.label.split(": ")[0]) + (r.eta && r.eta !== "no end" ? " · " + esc(r.eta) + " left" : "") : "Nothing running"}</span></div>
    <span class="chip gold">${svg("hour")}${esc(state.timeBank.text)}</span><span class="chip">${state.speed}x</span>`;
}

// ---- data ------------------------------------------------------------------------------------
async function load() {
  try {
    state = await api("state"); stateAt = performance.now();
    drawAppbar();
    if (tab === "bank") bank = await api("bank");
    if (tab === "log") droplog = await api("droplog");
    if (tab === "skills" && skill) skill = await api("skill?id=" + encodeURIComponent(skill.id));
    if (!sheetOn && !dragging) render();
  } catch (e) {
    if (e.message !== "not logged in") $("#view").innerHTML = `<div class="card fade"><b class="red">Can't reach the game</b><p class="muted small">${esc(e.message)}</p></div>`;
  }
}
let lastView = "";
function render() {
  if (!state) return;
  const html = tab === "now" ? renderNow() : tab === "queue" ? renderQueue() : tab === "skills" ? (skill ? renderSkill() : renderSkills())
             : tab === "bank" ? renderBank() : renderLog();
  const key = tab + (skill?.id || "");
  const v = $("#view");
  if (v.innerHTML !== html) { v.innerHTML = html; if (key !== lastView) v.firstElementChild?.classList.add("fade"); }
  lastView = key;
}

// ---- live action progress (animated between polls) ------------------------------------------
function liveProgress() {
  const r = state?.running;
  if (!r || r.interval == null || r.progress == null) return null;

// drag to reorder (pointer events on the handle)
let dragging = null;
document.addEventListener("pointerdown", e => {
  const hnd = e.target.closest("[data-handle]"); if (!hnd) return;
  e.preventDefault();
  const from = Number(hnd.dataset.handle), item = hnd.closest(".qitem");
  dragging = { from, to: from, item, id: e.pointerId };
  item.classList.add("dragging"); hnd.setPointerCapture(e.pointerId); buzz();
});
document.addEventListener("pointermove", e => {
  if (!dragging || e.pointerId !== dragging.id) return;
  const items = [...document.querySelectorAll(".qitem")];
  items.forEach(x => x.classList.remove("over-up", "over-down"));
  let to = dragging.from;
  for (const [i, el] of items.entries()) { const r = el.getBoundingClientRect(); if (e.clientY >= r.top && e.clientY <= r.bottom) { to = i; break; } }
  dragging.to = to;
  if (to !== dragging.from) items[to].classList.add(to < dragging.from ? "over-up" : "over-down");
});
document.addEventListener("pointerup", e => {
  if (!dragging || e.pointerId !== dragging.id) return;
  const { from, to } = dragging; dragging = null;
  document.querySelectorAll(".qitem").forEach(x => x.classList.remove("over-up", "over-down", "dragging"));
  if (to !== from) act("queue", { op: "move", i: from, to });
});

    <div class="row" style="margin-bottom:10px"><input type="number" id="sellqty" data-item="${data}" min="1" max="${i.qty}" value="${Math.max(1, i.qty - 1)}" class="grow">
      <button class="btn gold" data-do="sell" data-item="${data}">Sell for <span id="sellval">${short(Math.max(1, i.qty - 1) * i.each)}</span></button></div>
    <button class="btn red block" style="margin-bottom:8px" data-do="sellall" data-item="${data}">Sell all ${fmt(i.qty)} for ${short(i.value)}</button>`}
    <button class="btn ghost block" data-do="close">Close</button>`);
}

// ---- drop log --------------------------------------------------------------------------------
function renderLog() {
  if (!droplog) return `<div class="skel"></div>`;
  if (!droplog.length) return `<div class="card empty">Nothing logged yet.</div>`;
  return droplog.map(l => `<div class="card" ${l.current ? 'style="border-color:#6a5222"' : ""}><div class="row">${icon(l.icon)}<div class="grow">
      <div style="font-weight:700" class="${l.current ? "gold" : ""}">${esc(l.label)}</div>
      <div class="tiny muted">${fmt(l.actions)} actions · ${esc(l.time)} · ${short(l.xp)} XP</div></div></div>
    ${l.items.length ? `<div class="row" style="flex-wrap:wrap;gap:10px;margin-top:10px">` + l.items.slice(0, 14).map(i => `<span class="row" style="gap:4px" title="${esc(i.name)}">${icon(i.icon, "sm")}<span class="small">${short(i.qty)}</span></span>`).join("") + `</div>` : ""}</div>`).join("");
}

// ---- events ----------------------------------------------------------------------------------
$("#view").addEventListener("click", async e => {
  const go = e.target.closest("[data-tabgo]");
  if (go) { tab = go.dataset.tabgo; store("tab", tab); skill = null; drawNav(); render(); load(); window.scrollTo({ top: 0 }); return; }
  const d = e.target.closest("[data-do]");
  if (d) {
    const x = d.dataset.do;
    if (x === "stop") return act("stop", {});
    if (x === "bump") return act("queue", { op: "bump" });
    if (x === "qstart") return act("queue", { op: "start" });
    if (x === "qclear") return ask("Clear the whole queue?", "Clear", () => act("queue", { op: "clear" }));
    if (x === "skills") { skill = null; render(); window.scrollTo({ top: 0 }); return; }
    if (x === "pload") { const n = $("#preset").value; if (n) ask(`Replace the queue with "${n}"?`, "Load", () => act("queue", { op: "load", name: n }), false); return; }
    if (x === "pdel") { const n = $("#preset").value; if (n) ask(`Delete the saved queue "${n}"?`, "Delete", () => act("queue", { op: "delete", name: n })); return; }
    if (x === "psave") { const n = $("#pname").value.trim() || $("#preset").value; if (n) act("queue", { op: "save", name: n }); return; }
  }
  const q = e.target.closest("[data-q]");
  if (q) {
    if (q.dataset.q === "bump") return act("queue", { op: "bump" });
    if (q.dataset.q === "remove") return act("queue", { op: "remove", i: Number(q.dataset.i) });
  }
  const sk = e.target.closest("[data-skill]");
  if (sk) { try { skill = await api("skill?id=" + encodeURIComponent(sk.dataset.skill)); render(); window.scrollTo({ top: 0 }); } catch (err) { toast(err.message, true); } return; }
  const t = e.target.closest("[data-target]"); if (t) return openTarget(JSON.parse(t.dataset.target));
  const it = e.target.closest("[data-item]"); if (it) return openItem(JSON.parse(it.dataset.item));
  const sp = e.target.closest("[data-speed]"); if (sp) return act("speed", { value: Number(sp.dataset.speed) });
  const j = e.target.closest("[data-jump]"); if (j) { const el = document.getElementById(j.dataset.jump); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 70, behavior: "smooth" }); return; }
  const so = e.target.closest("[data-sort]"); if (so) { bankSort = so.dataset.sort; store("bankSort", bankSort); render(); return; }
  const skp = e.target.closest("[data-skip]");
  if (skp) {
    const minutes = skp.dataset.skip === "all" ? Math.floor(state.timeBank.ms / 60000) : Number(skp.dataset.skip);
    if (minutes <= 0) return toast("No banked time", true);
    const len = minutes >= 60 ? (minutes / 60).toFixed(1).replace(".0", "") + "h" : minutes + "m";
    openSheet(`<div class="grab"></div><div style="font-size:19px;font-weight:800">Skip ${len}?</div>
      <p class="muted">Uses ${len} of banked time at ${state.speed}x, about ${(minutes * state.speed / 60).toFixed(1)}h of game time. The game catches up in the background.</p>
      <button class="btn gold block" style="margin-bottom:8px" data-do="skipgo" data-minutes="${minutes}">${svg("hour")}Skip ${len}</button><button class="btn ghost block" data-do="close">Cancel</button>`);
  }
});
$("#view").addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.qtoggle) act("queue", { op: t.dataset.qtoggle, on: t.checked });
  if (t.id === "showLocked") { store("showLocked", t.checked ? "1" : "0"); render(); }
});
$("#view").addEventListener("input", e => {
  if (e.target.id !== "bq") return;
  bankQuery = e.target.value; const pos = e.target.selectionStart; render();
  const el = $("#bq"); el.focus(); el.setSelectionRange(pos, pos);
});

// ---- start + polling -------------------------------------------------------------------------
drawNav();
load();
setInterval(() => {
  if (document.hidden || sheetOn || dragging) return;
  if (tab === "bank" && document.activeElement?.id === "bq") return;
  if (tab === "now" || tab === "queue" || (tab === "skills" && !skill)) load();
  else api("state").then(s => { state = s; stateAt = performance.now(); drawAppbar(); }).catch(() => {});
}, 2000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
